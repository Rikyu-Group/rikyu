<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" font-family="'Noto Serif CJK JP','Hiragino Mincho ProN',serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#c9a35c"/>
    </marker>
  </defs>

  <rect width="980" height="620" fill="#161320"/>

  <text x="60" y="42" fill="#c9a35c" font-size="11" letter-spacing="4">FLOOR PLAN — 180㎡</text>
  <text x="60" y="66" fill="#f0e8d8" font-size="19" font-weight="600" letter-spacing="2">利休 ／ 間取り案</text>
  <text x="900" y="66" fill="#9a92a8" font-size="11" text-anchor="end">間口20m × 奥行9m（36㎡×5区画・間仕切り撤去）</text>

  <text x="480" y="98" fill="#5d7d6b" font-size="11" text-anchor="middle" letter-spacing="3">窓側（採光・眺望）</text>
  <line x1="60" y1="106" x2="900" y2="106" stroke="#5d7d6b" stroke-width="1" stroke-dasharray="4,4" stroke-opacity=".6"/>

  <!-- BAY 1 : サウナ＋アイスバス＋水回り -->
  <rect x="60" y="116" width="168" height="84" fill="#5d7d6b" fill-opacity=".38" stroke="#5d7d6b"/>
  <text x="144" y="152" fill="#f0e8d8" font-size="14" text-anchor="middle">アイスバス</text>
  <text x="144" y="172" fill="#9a92a8" font-size="9.5" text-anchor="middle">2〜3人・チラー</text>

  <rect x="60" y="200" width="168" height="168" fill="#5d7d6b" fill-opacity=".30" stroke="#5d7d6b"/>
  <text x="144" y="272" fill="#f0e8d8" font-size="15" text-anchor="middle">サウナ</text>
  <text x="144" y="296" fill="#9a92a8" font-size="9.5" text-anchor="middle">4〜6人・檜2段</text>
  <text x="144" y="314" fill="#9a92a8" font-size="9.5" text-anchor="middle">4m×4m（16㎡）</text>

  <rect x="60" y="368" width="168" height="126" fill="#5d7d6b" fill-opacity=".18" stroke="#5d7d6b"/>
  <text x="144" y="418" fill="#f0e8d8" font-size="12.5" text-anchor="middle">脱衣・シャワー</text>
  <text x="144" y="437" fill="#f0e8d8" font-size="12.5" text-anchor="middle">トイレ</text>
  <text x="144" y="456" fill="#9a92a8" font-size="9.5" text-anchor="middle">給排水はこの区画に集約</text>

  <!-- BAY 2 : ととのい（全面） -->
  <rect x="228" y="116" width="168" height="378" fill="#5d7d6b" fill-opacity=".30" stroke="#5d7d6b"/>
  <text x="312" y="268" fill="#f0e8d8" font-size="15" text-anchor="middle">ととのい</text>
  <text x="312" y="292" fill="#9a92a8" font-size="9.5" text-anchor="middle">リクライニングチェア6〜8脚</text>
  <text x="312" y="310" fill="#9a92a8" font-size="9.5" text-anchor="middle">窓側は眺めの特等席</text>

  <!-- BAY 3 : 中央 -->
  <rect x="396" y="116" width="168" height="126" fill="#c9a35c" fill-opacity=".16" stroke="#c9a35c"/>
  <text x="480" y="168" fill="#f0e8d8" font-size="13.5" text-anchor="middle">ワークスペース</text>
  <text x="480" y="190" fill="#9a92a8" font-size="9.5" text-anchor="middle">窓際カウンター4〜5席</text>

  <rect x="396" y="242" width="168" height="126" fill="#c9a35c" fill-opacity=".22" stroke="#c9a35c"/>
  <text x="480" y="294" fill="#f0e8d8" font-size="13.5" text-anchor="middle">カフェ・ラウンジ</text>
  <text x="480" y="316" fill="#9a92a8" font-size="9.5" text-anchor="middle">昼は茶・珈琲／夜はドリンク</text>

  <rect x="396" y="368" width="168" height="126" fill="#c9a35c" fill-opacity=".30" stroke="#c9a35c"/>
  <text x="480" y="420" fill="#f0e8d8" font-size="13.5" text-anchor="middle">エントランス・受付</text>
  <text x="480" y="442" fill="#9a92a8" font-size="9.5" text-anchor="middle">暖簾と格子戸（店の顔）</text>

  <!-- BAY 4 : 遊ぶ -->
  <rect x="564" y="116" width="168" height="168" fill="#b3673f" fill-opacity=".22" stroke="#b3673f"/>
  <text x="648" y="166" fill="#f0e8d8" font-size="13.5" text-anchor="middle">遊び場</text>
  <text x="648" y="188" fill="#9a92a8" font-size="9.5" text-anchor="middle">大型テレビ＋ゲーム</text>
  <text x="648" y="206" fill="#9a92a8" font-size="9.5" text-anchor="middle">ボードゲーム・将棋</text>
  <text x="648" y="224" fill="#9a92a8" font-size="9.5" text-anchor="middle">ソファと低テーブル</text>

  <rect x="564" y="284" width="168" height="210" fill="#b3673f" fill-opacity=".30" stroke="#b3673f"/>
  <rect x="600" y="318" width="96" height="146" rx="4" fill="none" stroke="#f0e8d8" stroke-opacity=".55"/>
  <text x="648" y="384" fill="#f0e8d8" font-size="13.5" text-anchor="middle">ビリヤード</text>
  <text x="648" y="404" fill="#9a92a8" font-size="9.5" text-anchor="middle">7ft台×1</text>
  <text x="648" y="421" fill="#9a92a8" font-size="9.5" text-anchor="middle">奥行方向に配置</text>

  <!-- BAY 5 : 和室 -->
  <rect x="732" y="116" width="168" height="189" fill="#7a4a3a" fill-opacity=".38" stroke="#b3673f"/>
  <text x="816" y="196" fill="#f0e8d8" font-size="13.5" text-anchor="middle">VIP和室 弐</text>
  <text x="816" y="218" fill="#9a92a8" font-size="9.5" text-anchor="middle">4m×4.5m・窓側</text>

  <rect x="732" y="305" width="168" height="189" fill="#7a4a3a" fill-opacity=".30" stroke="#b3673f"/>
  <text x="816" y="385" fill="#f0e8d8" font-size="13.5" text-anchor="middle">VIP和室 壱</text>
  <text x="816" y="407" fill="#9a92a8" font-size="9.5" text-anchor="middle">4m×4.5m・畳敷き</text>
  <text x="816" y="425" fill="#9a92a8" font-size="9.5" text-anchor="middle">商談・会食（予約制）</text>

  <g fill="#161320" stroke="#9a92a8" stroke-width="1">
    <rect x="222" y="110" width="12" height="12"/><rect x="222" y="488" width="12" height="12"/>
    <rect x="390" y="110" width="12" height="12"/><rect x="390" y="488" width="12" height="12"/>
    <rect x="558" y="110" width="12" height="12"/><rect x="558" y="488" width="12" height="12"/>
    <rect x="726" y="110" width="12" height="12"/><rect x="726" y="488" width="12" height="12"/>
  </g>

  <rect x="60" y="116" width="840" height="378" fill="none" stroke="#c9a35c" stroke-width="1.5"/>

  <path d="M208,462 L208,392" stroke="#c9a35c" stroke-width="1.4" marker-end="url(#ar)" stroke-opacity=".85"/>
  <path d="M208,346 L208,208" stroke="#c9a35c" stroke-width="1.4" marker-end="url(#ar)" stroke-opacity=".85"/>
  <path d="M212,158 L292,158" stroke="#c9a35c" stroke-width="1.4" marker-end="url(#ar)" stroke-opacity=".85"/>

  <text x="480" y="516" fill="#9a92a8" font-size="10" text-anchor="middle">← 20m（4m × 5区画）→</text>
  <text x="44" y="310" fill="#9a92a8" font-size="10" text-anchor="middle" transform="rotate(-90 44 310)">← 9m →</text>
  <text x="480" y="536" fill="#9a92a8" font-size="10.5" text-anchor="middle" letter-spacing="2">通路側（シャッター・入口）</text>

  <g font-size="10" fill="#9a92a8" font-family="'Noto Sans CJK JP',sans-serif">
    <rect x="60" y="566" width="10" height="10" fill="#5d7d6b" fill-opacity=".55" stroke="#5d7d6b"/>
    <text x="78" y="575">整う</text>
    <rect x="140" y="566" width="10" height="10" fill="#c9a35c" fill-opacity=".45" stroke="#c9a35c"/>
    <text x="158" y="575">迎える・働く</text>
    <rect x="248" y="566" width="10" height="10" fill="#b3673f" fill-opacity=".5" stroke="#b3673f"/>
    <text x="266" y="575">遊ぶ</text>
    <rect x="322" y="566" width="10" height="10" fill="#7a4a3a" fill-opacity=".6" stroke="#b3673f"/>
    <text x="340" y="575">つながる（和室）</text>
    <rect x="452" y="566" width="10" height="10" fill="#161320" stroke="#9a92a8"/>
    <text x="470" y="575">柱（撤去不可の想定）</text>
    <text x="620" y="575" fill="#c9a35c">→</text>
    <text x="638" y="575">整いの動線：脱衣→サウナ→アイスバス→ととのい</text>
  </g>
</svg>
